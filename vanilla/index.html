<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator</title>
</head>

<body>
  <main class="main">
    <h1 class="title">Random Quote Generator</h1>
    <div class="container">
      <div class="card">
        <div class="card-content">
          <div class="card-body">
            <i data-lucide="quote" aria-hidden="true"></i>
            <blockquote class="quote" aria-live="polite" aria-atomic="true">
              <p id="quote">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Aut possimus enim velit. Praesentium, explicabo fugiat.
              </p>
              <footer>
                - <span class="author" id="author">Lorem, ipsum dolor.</span>
              </footer>
            </blockquote>
          </div>
          <div class="card-cta">
            <button type="button" class="btn" id="generateQuote">
              <i data-lucide="refresh-ccw" aria-hidden="true"></i>
              <span>New quote</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
